services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7}
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=${INGRESS_NETWORK_ID:-llagents_ingress}
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ingress
    restart: unless-stopped

  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/llm-to-apps/manager}:${MANAGER_IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_INSTANCE_IMAGE: ${USER_INSTANCE_IMAGE:-llagents/user-instance:latest}
      DB_NETWORK_ID: ${DB_NETWORK_ID:-llagents_db}
      INGRESS_NETWORK_ID: ${INGRESS_NETWORK_ID:-llagents_ingress}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - internal
      - db

  web:
    image: ${WEB_IMAGE:-ghcr.io/llm-to-apps/web}:${WEB_IMAGE_TAG:-latest}
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
      MANAGER_URL: http://manager:8080
      AGENT_URL: http://agent:4111
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN}
      REDIS_URL: redis://redis:6379
    depends_on:
      - manager
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - internal
      - db
      - ingress
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)
        - traefik.http.routers.web.entrypoints=web
        - traefik.http.services.web.loadbalancer.server.port=3000

  worker:
    image: ${WEB_IMAGE:-ghcr.io/llm-to-apps/web}:${WEB_IMAGE_TAG:-latest}
    command: npm run worker:start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
      MANAGER_URL: http://manager:8080
      REDIS_URL: redis://redis:6379
      DEPLOY_WORKER_CONCURRENCY: ${DEPLOY_WORKER_CONCURRENCY:-2}
    depends_on:
      - manager
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - internal
      - db

  agent:
    image: ${AGENT_IMAGE:-ghcr.io/llm-to-apps/agent}:${AGENT_IMAGE_TAG:-latest}
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://${WEB_DOMAIN}}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-LLM to Apps}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-5-mini}
      MANAGER_URL: http://manager:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
    depends_on:
      - postgres
      - manager
    restart: unless-stopped
    networks:
      - internal
      - db

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-llagents_platform}
      POSTGRES_USER: ${POSTGRES_USER:-llagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      db:
        aliases:
          - postgres
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      db:
        aliases:
          - mysql
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres-data:
  mysql-data:
  redis-data:

networks:
  db:
    name: ${DB_NETWORK_ID:-llagents_db}
    external: true
  ingress:
    name: ${INGRESS_NETWORK_ID:-llagents_ingress}
    external: true
  internal:
    name: ${INTERNAL_NETWORK_ID:-llagents_internal}
    external: true
