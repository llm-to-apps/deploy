services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7}
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=${INGRESS_NETWORK_ID:-llagents_ingress}
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cpus: ${TRAEFIK_CPUS:-0.50}
    mem_limit: ${TRAEFIK_MEMORY_LIMIT:-512m}
    networks:
      - ingress
    restart: unless-stopped

  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/llm-to-apps/manager}:${MANAGER_IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_INSTANCE_IMAGE: ${USER_INSTANCE_IMAGE:-llagents/user-instance:latest}
      DB_NETWORK_ID: ${DB_NETWORK_ID:-llagents_db}
      INGRESS_NETWORK_ID: ${INGRESS_NETWORK_ID:-llagents_ingress}
      PROJECT_MEMORY_RESERVATION_MB: ${PROJECT_MEMORY_RESERVATION_MB:-128}
      PROJECT_MEMORY_LIMIT_MB: ${PROJECT_MEMORY_LIMIT_MB:-768}
      PROJECT_CPU_RESERVATION: ${PROJECT_CPU_RESERVATION:-0.05}
      PROJECT_CPU_LIMIT: ${PROJECT_CPU_LIMIT:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: ${MANAGER_CPUS:-0.50}
    mem_limit: ${MANAGER_MEMORY_LIMIT:-512m}
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - internal
      - db

  web:
    image: ${WEB_IMAGE:-ghcr.io/llm-to-apps/web}:${WEB_IMAGE_TAG:-latest}
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
      MANAGER_URL: http://manager:8080
      AGENT_URL: http://agent:4111
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN}
      REDIS_URL: redis://redis:6379
      AGENT_MEMORY_DEBUG: ${AGENT_MEMORY_DEBUG:-false}
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:3000}
      FORGEJO_GIT_URL: ${FORGEJO_GIT_URL:-http://forgejo:3000}
      FORGEJO_ADMIN_USER: ${FORGEJO_ADMIN_USER:-root}
      FORGEJO_ADMIN_PASSWORD: ${FORGEJO_ADMIN_PASSWORD}
    cpus: ${WEB_CPUS:-1.00}
    mem_limit: ${WEB_MEMORY_LIMIT:-1024m}
    depends_on:
      - manager
      - postgres
      - redis
      - forgejo
    restart: unless-stopped
    networks:
      - internal
      - db
      - ingress
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)
        - traefik.http.routers.web.entrypoints=web
        - traefik.http.services.web.loadbalancer.server.port=3000

  worker:
    image: ${WEB_IMAGE:-ghcr.io/llm-to-apps/web}:${WEB_IMAGE_TAG:-latest}
    command: npm run worker:start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
      MANAGER_URL: http://manager:8080
      REDIS_URL: redis://redis:6379
      DEPLOY_WORKER_CONCURRENCY: ${DEPLOY_WORKER_CONCURRENCY:-2}
      APP_READY_BASE_URL: ${APP_READY_BASE_URL:-http://traefik}
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:3000}
      FORGEJO_GIT_URL: ${FORGEJO_GIT_URL:-http://forgejo:3000}
      FORGEJO_ADMIN_USER: ${FORGEJO_ADMIN_USER:-root}
      FORGEJO_ADMIN_PASSWORD: ${FORGEJO_ADMIN_PASSWORD}
    cpus: ${WORKER_CPUS:-1.00}
    mem_limit: ${WORKER_MEMORY_LIMIT:-1024m}
    depends_on:
      - manager
      - postgres
      - redis
      - forgejo
    restart: unless-stopped
    networks:
      - internal
      - db
      - ingress

  agent:
    image: ${AGENT_IMAGE:-ghcr.io/llm-to-apps/agent}:${AGENT_IMAGE_TAG:-latest}
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://${WEB_DOMAIN}}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-LLM to Apps}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-5-mini}
      MANAGER_URL: http://manager:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-llagents}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-llagents_platform}
      MASTRA_DATABASE_SCHEMA: ${MASTRA_DATABASE_SCHEMA:-mastra}
    cpus: ${AGENT_CPUS:-1.00}
    mem_limit: ${AGENT_MEMORY_LIMIT:-1024m}
    depends_on:
      - postgres
      - manager
    restart: unless-stopped
    networks:
      - internal
      - db

  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15}
    entrypoint: ["/usr/local/bin/forgejo-bootstrap.sh"]
    environment:
      USER_UID: ${FORGEJO_USER_UID:-1000}
      USER_GID: ${FORGEJO_USER_GID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: ${FORGEJO_POSTGRES_DATABASE:-forgejo}
      FORGEJO__database__USER: ${FORGEJO_POSTGRES_USER:-forgejo}
      FORGEJO__database__PASSWD: ${FORGEJO_POSTGRES_PASSWORD}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_DISABLE_REGISTRATION:-false}
      FORGEJO_ADMIN_USER: ${FORGEJO_ADMIN_USER:-root}
      FORGEJO_ADMIN_PASSWORD: ${FORGEJO_ADMIN_PASSWORD}
      FORGEJO_ADMIN_EMAIL: ${FORGEJO_ADMIN_EMAIL:-root@example.local}
    volumes:
      - forgejo-data:/data
      - ../docker/forgejo/bootstrap.sh:/usr/local/bin/forgejo-bootstrap.sh:ro
    cpus: ${FORGEJO_CPUS:-1.00}
    mem_limit: ${FORGEJO_MEMORY_LIMIT:-1024m}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      internal:
      db:
        aliases:
          - forgejo

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-llagents_platform}
      POSTGRES_USER: ${POSTGRES_USER:-llagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FORGEJO_POSTGRES_DATABASE: ${FORGEJO_POSTGRES_DATABASE:-forgejo}
      FORGEJO_POSTGRES_USER: ${FORGEJO_POSTGRES_USER:-forgejo}
      FORGEJO_POSTGRES_PASSWORD: ${FORGEJO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init-forgejo-db.sh:/docker-entrypoint-initdb.d/20-forgejo-db.sh:ro
    cpus: ${POSTGRES_CPUS:-2.00}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2048m}
    networks:
      db:
        aliases:
          - postgres
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    cpus: ${MYSQL_CPUS:-2.00}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2048m}
    networks:
      db:
        aliases:
          - mysql
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    volumes:
      - redis-data:/data
    cpus: ${REDIS_CPUS:-0.50}
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    networks:
      - internal
    restart: unless-stopped

volumes:
  forgejo-data:
  postgres-data:
  mysql-data:
  redis-data:

networks:
  db:
    name: ${DB_NETWORK_ID:-llagents_db}
    external: true
  ingress:
    name: ${INGRESS_NETWORK_ID:-llagents_ingress}
    external: true
  internal:
    name: ${INTERNAL_NETWORK_ID:-llagents_internal}
    external: true
