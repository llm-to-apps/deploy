services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7}
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=${PUBLIC_NETWORK_NAME:-llagents_public}
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    restart: unless-stopped

  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/llm-to-apps/manager}:${MANAGER_IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_INSTANCE_IMAGE: ${USER_INSTANCE_IMAGE:-llagents/user-instance:latest}
      PUBLIC_NETWORK_ID: ${PUBLIC_NETWORK_NAME:-llagents_public}
      INTERNAL_NETWORK_ID: ${INTERNAL_NETWORK_NAME:-llagents_internal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-llagents_platform}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      internal:
        aliases:
          - mysql
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  public:
    name: ${PUBLIC_NETWORK_NAME:-llagents_public}
    external: true
  internal:
    name: ${INTERNAL_NETWORK_NAME:-llagents_internal}
    external: true
